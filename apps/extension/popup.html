<!doctype html>
<html>

<head>
    <meta charset="utf-8">
    <title>SuperSave</title>
    <style>
        :root {
            --bg: #0d0a13;
            --card-bg: #15111f;
            --border: #2c223a;
            --primary: #a865ff;
            --primary-gradient: linear-gradient(135deg, #ba82ff, #7444d7);
            --text: #f7f2fa;
            --muted: #a69cb0;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            width: 360px;
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
            padding: 18px;
        }

        .brand {
            font-weight: 800;
            font-size: 16px;
            display: flex;
            gap: 10px;
            align-items: center;
            letter-spacing: -0.02em;
        }

        .mark {
            width: 28px;
            height: 28px;
            border-radius: 8px;
            display: grid;
            place-items: center;
            background: var(--primary-gradient);
            box-shadow: 0 4px 14px rgba(135, 82, 233, 0.4);
            font-size: 14px;
        }

        .section-label {
            font-size: 10px;
            font-weight: 800;
            letter-spacing: 0.12em;
            color: var(--muted);
            margin: 18px 0 6px;
            text-transform: uppercase;
        }

        .input-group {
            display: flex;
            gap: 6px;
            position: relative;
        }

        .url-input {
            flex: 1;
            padding: 10px 12px;
            border-radius: 9px;
            border: 1px solid var(--border);
            background: var(--card-bg);
            color: #fff;
            font-size: 12px;
            outline: none;
            transition: border-color 0.15s ease;
        }

        .url-input:focus {
            border-color: #7b4ec8;
            box-shadow: 0 0 0 2px rgba(135, 82, 233, 0.2);
        }

        .paste-btn {
            padding: 0 12px;
            border-radius: 9px;
            border: 1px solid var(--border);
            background: #1e182c;
            color: #dcbfff;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.15s ease;
            white-space: nowrap;
        }

        .paste-btn:hover {
            background: #2b2140;
            color: #fff;
        }

        .current-page-box {
            margin-top: 10px;
            padding: 8px 10px;
            border-radius: 8px;
            background: rgba(25, 20, 36, 0.6);
            border: 1px dashed #2c223a;
            font-size: 11px;
            color: var(--muted);
            display: flex;
            align-items: center;
            gap: 6px;
            overflow: hidden;
        }

        .current-page-text {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: #d1c7dc;
            font-family: monospace;
            font-size: 10.5px;
        }

        .button {
            width: 100%;
            border: 0;
            border-radius: 10px;
            padding: 12px;
            cursor: pointer;
            font-weight: 700;
            font-size: 13px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            transition: transform 0.12s ease, box-shadow 0.12s ease;
        }

        .button:active {
            transform: scale(0.98);
        }

        .save {
            margin-top: 14px;
            background: var(--primary-gradient);
            color: white;
            box-shadow: 0 6px 20px rgba(135, 82, 233, 0.35);
        }

        .save:hover {
            box-shadow: 0 8px 24px rgba(135, 82, 233, 0.5);
        }

        .open {
            margin-top: 8px;
            background: #171223;
            border: 1px solid var(--border);
            color: #c9bed6;
            font-size: 12px;
        }

        .open:hover {
            background: #221a33;
            color: #fff;
        }

        .status {
            min-height: 18px;
            color: #d3b4ff;
            font-size: 11px;
            margin-top: 10px;
            text-align: center;
            font-weight: 600;
        }
    </style>
</head>

<body>
    <div class="brand">
        <div class="mark">🔖</div>
        SuperSave
    </div>

    <div class="section-label">PASTE MEDIA URL TO SAVE</div>
    <div class="input-group">
        <input id="url-input" class="url-input" type="url" placeholder="Paste YouTube, Reel, or article URL…" />
        <button id="paste-btn" class="paste-btn" type="button" title="Paste from clipboard">📋 Paste</button>
    </div>

    <div class="section-label" style="margin-top: 12px;">OR ACTIVE TAB</div>
    <div class="current-page-box" id="active-tab-box">
        <span>🌐</span>
        <span id="page" class="current-page-text">Detecting active page…</span>
    </div>

    <button id="save" class="button save">⚡ Save to SuperSave</button>
    <button id="open" class="button open">📚 Open Knowledge Library</button>

    <div id="status" class="status"></div>

    <script src="popup.js"></script>
</body>

</html>
