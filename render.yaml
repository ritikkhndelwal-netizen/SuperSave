# ==============================================================================
# Render Infrastructure as Code Blueprint
# Deploys the entire SuperSave platform on Render under a single project
# ==============================================================================
services:
  # ----------------------------------------------------------------------------
  # 1. Python FastAPI AI Service (Private Service with ffmpeg & yt-dlp)
  # ----------------------------------------------------------------------------
  - type: pserv
    name: supersave-ai
    env: docker
    dockerfilePath: ./services/ai/Dockerfile
    dockerContext: ./services/ai
    plan: starter
    region: oregon # or frankfurt, singapore, ohio
    envVars:
      - key: PORT
        value: 8000
      - key: GEMINI_API_KEY
        sync: false # Set securely in Render dashboard
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite

  # ----------------------------------------------------------------------------
  # 2. Express Node.js API Gateway (Public Web Service)
  # ----------------------------------------------------------------------------
  - type: web
    name: supersave-api
    env: node
    plan: starter
    region: oregon
    buildCommand: npm --workspace services/api i
    startCommand: npm --workspace services/api run start
    healthCheckPath: /health
    envVars:
      - key: API_PORT
        value: 10000
      - key: AI_SERVICE_URL
        value: http://supersave-ai:8000 # Internal Render private networking (free & fast)
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: NEXT_PUBLIC_APP_URL
        sync: false

  # ----------------------------------------------------------------------------
  # 3. Next.js Web App & Android PWA (Public Web Service)
  # ----------------------------------------------------------------------------
  - type: web
    name: supersave-web
    env: node
    plan: starter
    region: oregon
    buildCommand: npm --workspace apps/web i && npm --workspace apps/web run build
    startCommand: npm --workspace apps/web run start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
